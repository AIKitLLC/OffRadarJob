name: Uptime

# Checks public AI Kit endpoints every 10 minutes and opens/comments on an
# issue labeled `uptime` when the status changes; closes it on recovery. Lives in this PUBLIC repo so the
# Writes only on status change (open issue = down). 10-minute cron (~4,320 runs/month) does not consume private-repo minutes.
# Scheduled workflows only run from the default branch: live after merge.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe endpoints
        id: probe
        run: |
          set -u
          # url|accepted codes (space separated)
          checks=(
            "https://ai-kit.net/|200"
            "https://ai-kit.net/cloudflare/audit|200"
            "https://jobs.ai-kit.net/|200"
            "https://crm.ai-kit.net/|302"
            "https://crm-app.ai-kit.net/|200 302"
          )
          fail=0
          : > report.md
          for c in "${checks[@]}"; do
            url="${c%%|*}"; ok="${c#*|}"
            code=$(curl -s -o /dev/null -m 20 --retry 2 --retry-delay 5 -w '%{http_code}' "$url" || true)
            [ -z "$code" ] && code=000
            if [[ " $ok " == *" $code "* ]]; then
              echo "| $url | $code | OK |" >> report.md
            else
              echo "| $url | $code (expected $ok) | **FAIL** |" >> report.md
              fail=1
            fi
          done
          cat report.md
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Update uptime issue on status change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAIL: ${{ steps.probe.outputs.fail }}
        run: |
          set -euo pipefail
          # Last known state = the open/closed state of the `uptime` issue:
          # open issue = DOWN, no open issue = UP. Only transitions write to GitHub,
          # plus a comment when the set of failing URLs changes while DOWN.
          sig=$(grep FAIL report.md | sed 's/ |.*//; s/^| //' | sort | tr '\n' ' ' | sed 's/ $//' || true)
          marker="<!-- uptime-failing: ${sig} -->"
          now=$(date -u '+%Y-%m-%d %H:%M')
          num=$(gh issue list --label uptime --state open --limit 1 --json number -q '.[0].number // empty')
          if [ "$FAIL" = "1" ]; then
            body=$(printf '%s\nUptime check failed at %s UTC\n\n| URL | HTTP | Result |\n|---|---|---|\n%s\n\nRun: %s\n' "$marker" "$now" "$(cat report.md)" "$RUN_URL")
            if [ -z "$num" ]; then
              gh label create uptime --color B60205 --description "Uptime check failure" 2>/dev/null || true
              gh issue create --title "Uptime: endpoint check failing" --label uptime --body "$body"
              echo "::error::UP -> DOWN: $sig"
              exit 1
            fi
            last=$(gh issue view "$num" --json body,comments -q '[.body] + [.comments[].body] | map(select(contains("<!-- uptime-failing:"))) | last // ""' | grep -o '<!-- uptime-failing: [^>]*-->' | tail -1 || true)
            if [ "$last" != "$marker" ]; then
              gh issue comment "$num" --body "$body"
              echo "::warning::Still DOWN, failing set changed: $sig"
            else
              echo "Still DOWN, unchanged ($sig); issue #$num already open, no comment."
            fi
          elif [ -n "$num" ]; then
            body=$(printf 'All endpoints recovered at %s UTC\n\n| URL | HTTP | Result |\n|---|---|---|\n%s\n\nRun: %s\n' "$now" "$(cat report.md)" "$RUN_URL")
            gh issue comment "$num" --body "$body"
            gh issue close "$num" --reason completed
            echo "DOWN -> UP: closed #$num"
          else
            echo "Still UP; nothing to do."
          fi
